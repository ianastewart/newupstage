# For running locally: `docker compose up` reads this file automatically, and it publishes the app on http://localhost:8000.
# Coolify only uses docker-compose.yml, so this does not affect the deployment.
services:
  web:
    ports:
      - "8000:8000"
  # The database, for running Django outside docker (DATABASE_URL=postgres://upstage:<DB_PASSWORD>@localhost:5433/upstage).
  # 5433 so it doesn't clash with a local PostgreSQL on 5432.
  db:
    ports:
      - "5433:5432"
