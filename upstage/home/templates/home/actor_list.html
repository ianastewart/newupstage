{% extends "public_base.html" %}

{% block title %}Actors · Upstage Theatre{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl p-6">
  <h1 class="mb-6 text-3xl font-bold">Actors</h1>

  {% if not actors %}
    <div class="rounded-box bg-base-200 p-12 text-center">
      <p>No actors to show yet.</p>
    </div>
  {% else %}
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
      {% for person in actors %}
        <a href="{% url 'public-actor' person.pk %}" class="card bg-base-200 shadow-sm transition hover:shadow-md">
          <figure class="aspect-square w-full items-center justify-center bg-base-300">
            <img src="{{ person.image.image.url }}" alt="{{ person }}" loading="lazy" class="max-h-full max-w-full object-contain" />
          </figure>
          <div class="card-body p-3">
            <p class="truncate text-center font-semibold">{{ person }}</p>
          </div>
        </a>
      {% endfor %}
    </div>
  {% endif %}
</div>
{% endblock %}
