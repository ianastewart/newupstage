{# The hero's subtitle and text: over the image on wider screens, in a panel under it on phones. #}
{% if block.subtitle %}<p class="mt-1 text-lg drop-shadow md:mt-2 md:text-2xl">{{ block.subtitle }}</p>{% endif %}
{% if block.has_visible_text %}<div class="prose prose-themed mx-auto mt-3 max-w-2xl text-[16pt]! leading-snug! drop-shadow prose-a:text-inherit md:leading-normal!">{{ block.text|safe }}</div>{% endif %}
