<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      (() => {
          const themes = ['upstage', 'upstage-dark', 'light', 'dark'];
          let saved = null;
          try {
              saved = localStorage.getItem('theme');
          } catch (e) {
          }
          const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'upstage-dark' : 'upstage';
          document.documentElement.dataset.theme = themes.includes(saved) ? saved : preferred;
      })();
  </script>
  <link rel="stylesheet" href="{% static 'css/src/output.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <title>{% block title %}Upstage Theatre{% endblock %}</title>
  {% block head %}
  {% endblock %}
</head>

<body class="flex min-h-dvh flex-col">
<div id="nav">
  {% block nav %}{% include "includes/nav.html" %}{% endblock %}
</div>
<div id="hero">
  {% block hero %}
  {% endblock %}
</div>
<div id="content" class="container mx-auto flex grow flex-col *:w-full">
  {% block content %}{% endblock %}
</div>

<div id="footer">
  {% include "includes/footer.html" %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
